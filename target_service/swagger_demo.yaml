openapi: "3.0.0"
info:
  title: 示例API
  version: "1.0.0"
servers:
  - url: http://localhost:8080
paths:
  /api/user/login:
    post:
      tags:
        - 用户
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: 用户名
                  example: admin
                password:
                  type: string
                  description: 密码
                  example: "123456"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user_id:
                        type: integer
        "401":
          description: 登录失败
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 1001
                  msg:
                    type: string
                    example: 用户名或密码错误
  /api/user/register:
    post:
      tags:
        - 用户
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, email]
              properties:
                username:
                  type: string
                  description: 用户名
                password:
                  type: string
                  description: 密码
                email:
                  type: string
                  description: 邮箱
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
  /api/user/info:
    get:
      tags:
        - 用户
      summary: 获取用户信息
      parameters:
        - name: token
          in: header
          required: true
          schema:
            type: string
          description: 认证token
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      email:
                        type: string